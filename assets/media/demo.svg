<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal Background -->
  <rect width="800" height="500" fill="#1e1e1e" rx="8"/>
  
  <!-- Terminal Header -->
  <rect width="800" height="40" fill="#2d2d2d" rx="8"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27ca3f"/>
  <text x="400" y="25" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">NewTerminal - AI-Powered Shell Assistant</text>
  
  <!-- Terminal Content -->
  <text x="20" y="70" fill="#00ff00" font-family="monospace" font-size="14">user@computer:~$</text>
  <text x="140" y="70" fill="#ffffff" font-family="monospace" font-size="14">ai "find all large files over 100MB"</text>
  
  <text x="20" y="100" fill="#ffff00" font-family="monospace" font-size="12">🤖 NewTerminal AI:</text>
  <text x="20" y="120" fill="#ffffff" font-family="monospace" font-size="12">Suggested: find / -type f -size +100M -exec ls -lh {} \; 2>/dev/null</text>
  
  <text x="20" y="150" fill="#00ffff" font-family="monospace" font-size="12">Run this command? (y/n): y</text>
  
  <text x="20" y="180" fill="#ffffff" font-family="monospace" font-size="12">-rw-r--r-- 1 user user 150M Dec 15 10:30 /home/user/video.mp4</text>
  <text x="20" y="200" fill="#ffffff" font-family="monospace" font-size="12">-rw-r--r-- 1 user user 200M Dec 14 09:15 /var/log/system.log</text>
  <text x="20" y="220" fill="#ffffff" font-family="monospace" font-size="12">-rw-r--r-- 1 user user 120M Dec 13 14:22 /tmp/backup.tar</text>
  
  <text x="20" y="260" fill="#00ff00" font-family="monospace" font-size="14">user@computer:~$</text>
  <text x="140" y="260" fill="#ffffff" font-family="monospace" font-size="14">ai "compress these large files"</text>
  
  <text x="20" y="290" fill="#ffff00" font-family="monospace" font-size="12">🤖 NewTerminal AI:</text>
  <text x="20" y="310" fill="#ffffff" font-family="monospace" font-size="12">Suggested: gzip /home/user/video.mp4 /var/log/system.log /tmp/backup.tar</text>
  
  <!-- Features Box -->
  <rect x="500" y="350" width="280" height="130" fill="#2d2d2d" stroke="#00ff00" stroke-width="2" rx="5"/>
  <text x="510" y="370" fill="#00ff00" font-family="sans-serif" font-size="14" font-weight="bold">✨ NewTerminal Features:</text>
  <text x="510" y="390" fill="#ffffff" font-family="sans-serif" font-size="12">• Natural language → Shell commands</text>
  <text x="510" y="405" fill="#ffffff" font-family="sans-serif" font-size="12">• Works offline with local AI</text>
  <text x="510" y="420" fill="#ffffff" font-family="sans-serif" font-size="12">• Cross-platform (Linux/macOS/Windows)</text>
  <text x="510" y="435" fill="#ffffff" font-family="sans-serif" font-size="12">• Auto-detects optimal AI model</text>
  <text x="510" y="450" fill="#ffffff" font-family="sans-serif" font-size="12">• One-line installation</text>
  <text x="510" y="465" fill="#ffffff" font-family="sans-serif" font-size="12">• Privacy-focused (runs locally)</text>
  
  <!-- Cursor -->
  <rect x="320" y="250" width="10" height="15" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>