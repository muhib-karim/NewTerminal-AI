name: NewTerminal Release

on:
  push:
    tags:
      - "v*.*"   # Runs on version tags like v1.0, v1.1, etc.

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release ZIP
        run: |
          mkdir -p newterminal-${GITHUB_REF_NAME}
          cp install.sh newterminal-${GITHUB_REF_NAME}/
          cp install.ps1 newterminal-${GITHUB_REF_NAME}/
          cp NewTerminal-AI.psm1 newterminal-${GITHUB_REF_NAME}/
          cp README.md newterminal-${GITHUB_REF_NAME}/
          cp LICENSE newterminal-${GITHUB_REF_NAME}/
          # Copy media folder if it exists and has content
          if [ -d "media" ] && [ "$(ls -A media)" ]; then
            cp -r media newterminal-${GITHUB_REF_NAME}/
          else
            mkdir -p newterminal-${GITHUB_REF_NAME}/media
          fi
          cd newterminal-${GITHUB_REF_NAME}
          zip -r ../newterminal-${GITHUB_REF_NAME}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: newterminal-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
