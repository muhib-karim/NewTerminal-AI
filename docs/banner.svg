<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="NewTerminal-AI: plain English in, PowerShell commands out, powered by local Ollama models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0c2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="140" font-size="64" font-weight="700" fill="#f8fafc">NewTerminal<tspan fill="url(#accent)">-AI</tspan></text>
    <text x="82" y="190" font-size="26" fill="#cbd5e1">Plain English in, PowerShell out, powered by local Ollama models</text>
    <g font-size="16" fill="#94a3b8">
      <rect x="82" y="222" width="118" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="141" y="243" text-anchor="middle">PowerShell</text>
      <rect x="212" y="222" width="94" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="259" y="243" text-anchor="middle">Ollama</text>
      <rect x="318" y="222" width="138" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="387" y="243" text-anchor="middle">Safety checks</text>
    </g>
  </g>

  <!-- Terminal motif -->
  <g transform="translate(790 64)">
    <rect width="420" height="192" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M14 0h392a14 14 0 0 1 14 14v22H0V14A14 14 0 0 1 14 0z" fill="#1e293b"/>
    <circle cx="22" cy="18" r="6" fill="#ef4444"/>
    <circle cx="42" cy="18" r="6" fill="#eab308"/>
    <circle cx="62" cy="18" r="6" fill="#22c55e"/>
    <g font-family="Consolas, Menlo, monospace" font-size="17">
      <text x="22" y="78" fill="#38bdf8">AI&gt;</text>
      <text x="64" y="78" fill="#e2e8f0">show disk space</text>
      <path d="M26 98v18h14" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 111l5 5-5 5" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="122" fill="#facc15">Get-PSDrive -PSProvider FileSystem</text>
      <text x="22" y="164" fill="#38bdf8">AI&gt;</text>
      <rect x="64" y="150" width="10" height="18" fill="#e2e8f0" opacity="0.85"/>
    </g>
  </g>
  <rect y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
