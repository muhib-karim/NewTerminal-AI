<svg xmlns="http://www.w3.org/2000/svg" width="980" height="456" viewBox="0 0 980 456" role="img" aria-label="Real PSScriptAnalyzer and Pester run output">
<rect width="980" height="456" rx="10" fill="#0f172a"/>
<rect width="980" height="34" rx="10" fill="#1e293b"/><rect y="24" width="980" height="10" fill="#1e293b"/>
<circle cx="20" cy="17" r="6" fill="#ef4444"/><circle cx="40" cy="17" r="6" fill="#eab308"/><circle cx="60" cy="17" r="6" fill="#22c55e"/>
<text x="490" y="22" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">pwsh 7.4 — NewTerminal-AI lint + tests (excerpt of a real run)</text>
<g font-family="Consolas, Menlo, monospace" font-size="13" xml:space="preserve">
<text x="18" y="56" fill="#7dd3fc" font-weight="bold">$ pwsh ./tools/Invoke-Lint.ps1</text>
<text x="18" y="75" fill="#4ade80">PSScriptAnalyzer: no findings.</text>
<text x="18" y="94" fill="#7dd3fc" font-weight="bold">$ pwsh -c &#x27;Invoke-Pester -Path ./tests -Output Detailed&#x27;</text>
<text x="18" y="113" fill="#94a3b8">Pester v5.7.1</text>
<text x="18" y="132" fill="#94a3b8">Discovery found 58 tests in 281ms.</text>
<text x="18" y="151" fill="#e2e8f0" font-weight="bold">Describing Test-CommandSafety</text>
<text x="18" y="170" fill="#4ade80">  [+] flags dangerous command: rm -rf / 66ms (62ms|4ms)</text>
<text x="18" y="189" fill="#4ade80">  [+] flags dangerous command: Remove-Item -Path C:\ -Recurse -Force 7ms (5ms|2ms)</text>
<text x="18" y="208" fill="#4ade80">  [+] flags dangerous command: Remove-Item -Recurse -Force C:\Windows 7ms (5ms|2ms)</text>
<text x="18" y="227" fill="#4ade80">  [+] flags dangerous command: del /s /q c:\ 7ms (5ms|2ms)</text>
<text x="18" y="246" fill="#64748b">  ...</text>
<text x="18" y="265" fill="#e2e8f0" font-weight="bold">Describing Invoke-AICommand</text>
<text x="18" y="284" fill="#4ade80">  [+] stops early when Ollama is not reachable 65ms (63ms|2ms)</text>
<text x="18" y="303" fill="#4ade80">  [+] refuses to auto-execute a command flagged as dangerous 143ms (141ms|1ms)</text>
<text x="18" y="322" fill="#4ade80">  [+] auto-executes a safe, de-fenced command and records it 85ms (83ms|1ms)</text>
<text x="18" y="341" fill="#e2e8f0" font-weight="bold">Describing Interactive REPL</text>
<text x="18" y="360" fill="#4ade80">  [+] Start-AITerminal returns when the user types exit 56ms (53ms|3ms)</text>
<text x="18" y="379" fill="#4ade80">  [+] Start-NLMode returns when the user types exit 32ms (31ms|2ms)</text>
<text x="18" y="398" fill="#94a3b8">Tests completed in 5.5s</text>
<text x="18" y="417" fill="#4ade80" font-weight="bold">Tests Passed: 58, Failed: 0, Skipped: 0, Inconclusive: 0, NotRun: 0</text>
</g>
